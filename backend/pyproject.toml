[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-insight-backend"
version = "0.1.0"
description = "Trusted enterprise ontology and management exploration backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "cryptography>=44,<48",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
postgresql = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
enterprise-insight-backend = "enterprise_insight_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_insight_backend = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["enterprise_insight_backend"]
