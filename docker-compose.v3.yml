name: enterprise-insight-v3

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.v3
      args:
        BUILD_ID: ${BUILD_ID:-local-container}
    image: enterprise-insight-v3:local
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${EI_PORT:-8012}:8012"
    environment:
      EI_BACKEND_DATA_DIR: /app/data
      EI_BACKEND_FRONTEND_DIST_DIR: /app/frontend
      EI_BACKEND_BUILD_ID: ${BUILD_ID:-local-container}
      EI_BACKEND_AGENT_WORKER_ENABLED: "true"
    volumes:
      - enterprise_insight_v3_data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8012/api/v3/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s

volumes:
  enterprise_insight_v3_data:
